# Source: expense-tracker/templates/backend/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-expense-tracker-backend
  labels:
    
    helm.sh/chart: expense-tracker-0.1.0
    app.kubernetes.io/name: expense-tracker
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: v1.0
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-name-expense-tracker-backend
  template:
    metadata:
      labels:
        app: release-name-expense-tracker-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: "docker.io/kaderdevops/expense-tracker-be:v1.0"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7070
          envFrom:
            - configMapRef:
                name: release-name-expense-tracker-backend-config
            - secretRef:
                name: release-name-expense-tracker-backend-secret
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads
          livenessProbe:
            httpGet:
              path: /health
              port: 7070
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 7070
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: uploads-volume
          emptyDir: {}
