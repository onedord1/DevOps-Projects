# Source: expense-tracker/templates/db/postgres-sts.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: release-name-expense-tracker-postgres
  labels:
    
    helm.sh/chart: expense-tracker-0.1.0
    app.kubernetes.io/name: expense-tracker
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: v1.0
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: release-name-expense-tracker-postgres
  replicas: 1
  selector:
    matchLabels:
      app: release-name-expense-tracker-postgres
  template:
    metadata:
      labels:
        app: release-name-expense-tracker-postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: "postgres:17"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: release-name-expense-tracker-postgres-secret
                  key: postgresUser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: release-name-expense-tracker-postgres-secret
                  key: postgresPassword
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-pvc
              mountPath: /var/lib/postgresql/data
            - name: postgres-init-script
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-init-script
          configMap:
            name: release-name-expense-tracker-postgres-config
  volumeClaimTemplates:
    - metadata:
        name: postgres-pvc
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
        storageClassName: longhorn
