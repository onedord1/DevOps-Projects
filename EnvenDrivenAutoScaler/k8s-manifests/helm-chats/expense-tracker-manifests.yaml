kind: Ingress
metadata:
  name: release-name-expense-tracker-ingress
  labels:
    
    helm.sh/chart: expense-tracker-0.1.0
    app.kubernetes.io/name: expense-tracker
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: v1.0
    app.kubernetes.io/managed-by: Helm
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
spec:
  ingressClassName: nginx-expense-tracker
  rules:
  - host: example.com
    http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: release-name-expense-tracker-backend
            port:
              number: 7070
      - path: /
        pathType: Prefix
        backend:
          service:
            name: release-name-expense-tracker-frontend
            port:
              number: 80
  tls:
