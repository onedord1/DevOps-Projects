# base/kustomization.yaml (FIXED VERSION)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: expense-tracker-base

namespace: expense-tracker

labels:
  - pairs:
      app: expense-tracker
      managed-by: kustomize

resources:
- resources/frontend/frontend-deployment.yaml
- resources/frontend/frontend-service.yaml
- resources/backend/backend-deployment.yaml
- resources/backend/backend-service.yaml
- resources/database/postgres-sts.yaml
- resources/database/postgres-service.yaml

generatorOptions:
  disableNameSuffixHash: false

configMapGenerator:
- name: frontend-config
  literals:
  - API_URL=http://expense-tracker-be-service:7070
- name: backend-config
  literals:
  - DB_HOST=postgres-service
  - DB_PORT=5432
  - DB_USERNAME=applicationuser
  - DB_NAME=expense_tracker
  - DB_SSL_MODE=disable
  - DB_DRIVER=postgres
  - DB_MAX_OPEN_CONNS=100
  - DB_MAX_IDLE_CONNS=25
  - DB_CONN_MAX_LIFETIME=5m
  - DB_CONN_MAX_IDLE_TIME=1m
  - ENVIRONMENT=production
  - LOG_LEVEL=INFO
  - ENABLE_PROFILING=false
  - PORT=7070
  - READ_TIMEOUT=5s
  - WRITE_TIMEOUT=10s
  - IDLE_TIMEOUT=120s
  - GOMAXPROCS=0
  - GOGC=100
  - GOMEMLIMIT=1073741824
  - UPLOAD_DIR=/app/uploads
  - MAX_FILE_SIZE=10485760
  - STORAGE_TYPE=local
  - SMTP_HOST=smtp.gmail.com
  - SMTP_PORT=587
  - SMTP_USERNAME=your-email@gmail.com
  - FROM_EMAIL=your-email@gmail.com
  - REDIS_HOST=localhost
  - REDIS_PORT=6379
  - REDIS_DB=0
  - REDIS_POOL_SIZE=50
  - ELASTICSEARCH_URL=http://localhost:9200
  - ELASTICSEARCH_USERNAME=
  - ELASTICSEARCH_INDEX=expenses
  - JWT_EXPIRY_DAYS=7
- name: postgres-config
  files:
  - configs/postgres-init.sql

secretGenerator:
- name: backend-secret
  envs:
  - configs/secrets.env
- name: postgres-secret
  envs:
  - configs/postgres-secrets.env
- name: docker-registry-secret
  type: kubernetes.io/dockerconfigjson
  files:
  - .dockerconfigjson=configs/dockerconfigjson.json