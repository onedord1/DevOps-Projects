# overlays/development/kustomization.yaml (CORRECTED PATCHES SYNTAX)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namePrefix: dev-

labels:
  - pairs:
      env: development

# Use the correct patches syntax
patches:
- path: patches/frontend-config.yaml
- path: patches/backend-config.yaml
- path: patches/replica-counts.yaml

images:
- name: docker.io/kaderdevops/expense-tracker-be
  newTag: "v1.0"
- name: docker.io/kaderdevops/expense-tracker-fe
  newTag: "v1.4"
- name: postgres
  newTag: "17"

replicas:
- name: expense-tracker-be
  count: 1
- name: expense-tracker-fe
  count: 1
- name: postgres-sts
  count: 1