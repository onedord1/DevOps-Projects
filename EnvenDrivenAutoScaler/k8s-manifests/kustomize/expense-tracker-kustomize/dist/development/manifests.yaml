apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: expense-tracker
    env: development
    managed-by: kustomize
  name: dev-expense-tracker-be
  namespace: expense-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-tracker-be
  template:
    metadata:
      labels:
        app: expense-tracker-be
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: dev-backend-config-h8gdh698h5
        - secretRef:
            name: dev-backend-secret-2th2mb464g
        image: docker.io/kaderdevops/expense-tracker-be:v1.0
        livenessProbe:
          httpGet:
            path: /health
            port: 7070
          initialDelaySeconds: 15
          periodSeconds: 20
        name: backend
        ports:
        - containerPort: 7070
        readinessProbe:
          httpGet:
            path: /health
            port: 7070
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /app/uploads
          name: uploads-volume
      imagePullSecrets:
      - name: dev-docker-registry-secret-t824fdtgc8
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      volumes:
