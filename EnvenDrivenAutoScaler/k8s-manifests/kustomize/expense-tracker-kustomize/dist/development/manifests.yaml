          name: nginx-cache
        - mountPath: /var/run
          name: nginx-pid
      imagePullSecrets:
      - name: dev-docker-registry-secret-t824fdtgc8
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
      volumes:
