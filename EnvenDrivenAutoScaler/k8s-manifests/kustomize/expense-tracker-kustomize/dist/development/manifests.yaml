      - env:
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              key: API_URL
              name: dev-frontend-config-mg88h5486k
        image: docker.io/kaderdevops/expense-tracker-fe:v1.3
        livenessProbe:
          httpGet:
