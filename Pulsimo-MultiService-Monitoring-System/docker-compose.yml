services:
  postgres:
    image: postgres:17-alpine
    container_name: monitoring-postgres
    environment:
      POSTGRES_DB: monitoring_system
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring_password
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: monitoring-redis
    ports:
      - "0.0.0.0:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    container_name: monitoring-api-gateway
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://monitoring:monitoring_password@postgres:5432/monitoring_system
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      RUST_LOG: info
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  checker:
    build:
      context: ./backend
      dockerfile: services/checker/Dockerfile
    container_name: monitoring-checker
    environment:
      DATABASE_URL: postgresql://monitoring:monitoring_password@postgres:5432/monitoring_system
      REDIS_URL: redis://redis:6379
      CHECK_INTERVAL_SECONDS: 30
      MAX_CONCURRENT_CHECKS: 100
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification:
    build:
      context: ./backend
      dockerfile: services/notification/Dockerfile
    container_name: monitoring-notification
    environment:
      DATABASE_URL: postgresql://monitoring:monitoring_password@postgres:5432/monitoring_system
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@monitoring.example.com}
      FROM_NAME: ${FROM_NAME:-Service Monitoring}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monitoring-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://192.168.10.69:8080
      NEXT_PUBLIC_WS_URL: ws://192.168.10.69:8080
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
