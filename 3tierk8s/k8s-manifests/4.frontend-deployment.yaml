apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-frontend-app
  namespace: employee-management-app
  labels:
    app: employee-frontend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-frontend-app
  template:
    metadata:
      labels:
        app: employee-frontend-app
    spec:
      containers:
      - name: employee-frontend-app
        image: your-docker-registry/frontend-app:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: employee-frontend-app-service
  namespace: employee-management-app
spec:
  selector:
    app: employee-frontend-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP