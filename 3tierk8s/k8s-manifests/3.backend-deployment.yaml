# backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-backend-app
  namespace: employee-management-app
  labels:
    app: employee-backend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-backend-app
  template:
    metadata:
      labels:
        app: employee-backend-app
    spec:
      containers:
      - name: employee-backend-app
        image: your-docker-registry/backend-api:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: employee-database-credentials
              key: host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: employee-database-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: employee-database-credentials
              key: password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: employee-database-credentials
              key: database
        - name: PORT
          value: "5000"
        - name: DEPLOYMENT_NAME
          value: "employee-backend-app"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: employee-backend-app-service
  namespace: employee-management-app
spec:
  selector:
    app: employee-backend-app
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP