# Grafana Alloy — log collection DaemonSet (sync-wave -10).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.10.0
    helm:
      valueFiles:
      - $values/observability-driven-gitops-release-system/observability/values/alloy.values.yaml
  - repoURL: "https://github.com/onedord1/DevOps-Projects.git"
    targetRevision: "HEAD"
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
