# Argo Rollouts (sync-wave -25): installed before the Acme app so the Rollout
# CRD exists when the workloads (Rollouts) sync. Multi-source: chart upstream +
# values from this git repo (registers the Gateway API traffic-router plugin).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
  - repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.41.0
    helm:
      valueFiles:
      - $values/observability-driven-gitops-release-system/rollouts/values/argo-rollouts.values.yaml
  - repoURL: https://github.com/onedord1/DevOps-Projects.git
    targetRevision: HEAD
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
