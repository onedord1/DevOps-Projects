# inventory — canary Rollout (replica-based). Analysis covers RED SLIs plus the
# restart/CPU/memory resource guardrails.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inventory
  labels:
    app.kubernetes.io/name: inventory
  annotations:
    # Phase 9: subscribe to Rollout notifications → incident service + Grafana
    notifications.argoproj.io/subscribe.on-rollout-aborted.incident: ""
    notifications.argoproj.io/subscribe.on-rollout-completed.incident: ""
    notifications.argoproj.io/subscribe.on-rollout-aborted.dashboard: ""
    notifications.argoproj.io/subscribe.on-rollout-completed.dashboard: ""
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory
  strategy:
    canary:
      steps:
      - setWeight: 5
      - pause: { duration: 30s }
      - analysis: &inventory-analysis
          templates:
          - templateName: http-success-rate
          - templateName: http-5xx-rate
          - templateName: p95-latency
          - templateName: restart-count
          - templateName: cpu-utilization
          - templateName: memory-utilization
          args:
          - name: service-name
            value: inventory
          - name: container-name
            value: inventory
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      - setWeight: 20
      - pause: { duration: 30s }
      - analysis: *inventory-analysis
      - setWeight: 50
      - pause: { duration: 30s }
      - analysis: *inventory-analysis
      - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inventory
        image: acme/inventory
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: acme-auth
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.monitoring.svc:4318
        - name: LOG_LEVEL
          value: info
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 5
          periodSeconds: 15
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  labels:
    app.kubernetes.io/name: inventory
spec:
  selector:
    app.kubernetes.io/name: inventory
  ports:
  - name: http
    port: 8080
    targetPort: http
