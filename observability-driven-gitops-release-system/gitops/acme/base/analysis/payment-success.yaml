# Reusable AnalysisTemplate: payment success rate (business SLO) for the CANARY
# payment pods. Attached to the payment Rollout — a release that declines more
# payments aborts automatically.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: payment-success
spec:
  args:
  - name: canary-hash
  - name: payment-success-threshold
    value: "0.95"
  - name: prometheus-address
    value: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
  metrics:
  - name: payment-success
    interval: 30s
    count: 3
    successCondition: "len(result) == 0 || result[0] >= {{args.payment-success-threshold}}"
    failureLimit: 1
    provider:
      prometheus:
        address: "{{args.prometheus-address}}"
        query: |
          sum(rate(payments_total{
            result="success",
            rollouts_pod_template_hash="{{args.canary-hash}}"}[2m]))
          /
          clamp_min(sum(rate(payments_total{
            rollouts_pod_template_hash="{{args.canary-hash}}"}[2m])), 1e-9)
