# Reusable AnalysisTemplate: HTTP success rate of the CANARY pods.
# Args: service-name, canary-hash (from the Rollout), optional threshold.
# Fails the canary if the success ratio drops below the threshold.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: http-success-rate
spec:
  args:
  - name: service-name
  - name: canary-hash
  - name: success-rate-threshold
    value: "0.99"
  - name: prometheus-address
    value: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
  metrics:
  - name: http-success-rate
    interval: 30s
    count: 3
    successCondition: "len(result) == 0 || result[0] >= {{args.success-rate-threshold}}"
    failureLimit: 1
    provider:
      prometheus:
        address: "{{args.prometheus-address}}"
        query: |
          sum(rate(http_requests_total{
            service="{{args.service-name}}",
            rollouts_pod_template_hash="{{args.canary-hash}}",
            code!~"5.."}[2m]))
          /
          clamp_min(sum(rate(http_requests_total{
            service="{{args.service-name}}",
            rollouts_pod_template_hash="{{args.canary-hash}}"}[2m])), 1e-9)
