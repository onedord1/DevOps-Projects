# payment — canary Rollout (replica-based; internal ClusterIP service). Analysis
# includes the payment-success business SLO, so a release that declines more
# payments aborts automatically.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
  annotations:
    # Phase 9: subscribe to Rollout notifications → incident service + Grafana
    notifications.argoproj.io/subscribe.on-rollout-aborted.incident: ""
    notifications.argoproj.io/subscribe.on-rollout-completed.incident: ""
    notifications.argoproj.io/subscribe.on-rollout-aborted.dashboard: ""
    notifications.argoproj.io/subscribe.on-rollout-completed.dashboard: ""
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
  strategy:
    canary:
      steps:
      - setWeight: 5
      - pause: { duration: 30s }
      - analysis: &payment-analysis
          templates:
          - templateName: http-success-rate
          - templateName: p95-latency
          - templateName: payment-success
          - templateName: restart-count
          args:
          - name: service-name
            value: payment
          - name: container-name
            value: payment
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      - setWeight: 20
      - pause: { duration: 30s }
      - analysis: *payment-analysis
      - setWeight: 50
      - pause: { duration: 30s }
      - analysis: *payment-analysis
      - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: payment
        image: acme/payment
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: acme-auth
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.monitoring.svc:4318
        - name: LOG_LEVEL
          value: info
        - name: FAIL_RATE
          value: "0" # Phase 10 sets this to demo an automatic rollback
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 5
          periodSeconds: 15
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
spec:
  selector:
    app.kubernetes.io/name: payment
  ports:
  - name: http
    port: 8080
    targetPort: http
