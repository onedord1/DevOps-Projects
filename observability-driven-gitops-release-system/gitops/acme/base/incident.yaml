# incident — in-cluster incident webhook service (Phase 9).
#
# Receives:
#   POST /alertmanager  — Alertmanager webhook payloads
#   POST /rollout       — Argo Rollouts notifications (aborted | completed)
#   GET  /incidents     — list all open + resolved incidents (JSON)
#
# The service is internal-only (ClusterIP). No JWT / acme-auth needed.
# Exposes Prometheus metrics on /metrics and health probes on /healthz + /readyz.
#
# Source: apps/services/incident/main.go
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident
  labels:
    app.kubernetes.io/name: incident
    app.kubernetes.io/component: incident-webhook
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: incident
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident
      annotations:
        # Prometheus scrape wiring (Prometheus Operator reads the ServiceMonitor;
        # these pod annotations are for Alloy / agent scraping as a fallback).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: incident
        image: acme/incident
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: info
        - name: SERVICE_NAME
          value: incident
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.monitoring.svc:4318
        - name: OTEL_SERVICE_NAME
          value: incident
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 15
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
---
apiVersion: v1
kind: Service
metadata:
  name: incident
  labels:
    app.kubernetes.io/name: incident
    app.kubernetes.io/component: incident-webhook
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: incident
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
