# frontend — canary Rollout with Gateway API traffic routing. Argo Rollouts
# shifts weight on the `frontend` HTTPRoute (stable vs canary backends) via the
# gatewayAPI plugin, running SLO analysis between steps (5 → 20 → 50 → 100%).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: bff
  annotations:
    # Phase 9: subscribe to Rollout notifications → incident service + Grafana
    notifications.argoproj.io/subscribe.on-rollout-aborted.incident: ""
    notifications.argoproj.io/subscribe.on-rollout-completed.incident: ""
    notifications.argoproj.io/subscribe.on-rollout-aborted.dashboard: ""
    notifications.argoproj.io/subscribe.on-rollout-completed.dashboard: ""
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    canary:
      canaryService: frontend-canary
      stableService: frontend-stable
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: frontend
            namespace: acme
      steps:
      - setWeight: 5
      - pause: { duration: 30s }
      - analysis: &frontend-analysis
          templates:
          - templateName: http-success-rate
          - templateName: http-5xx-rate
          - templateName: p95-latency
          args:
          - name: service-name
            value: frontend
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      - setWeight: 20
      - pause: { duration: 30s }
      - analysis: *frontend-analysis
      - setWeight: 50
      - pause: { duration: 30s }
      - analysis: *frontend-analysis
      - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: acme/frontend # overlay sets newName/newTag
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: acme-auth
        env:
        - name: ORDER_URL
          value: http://order:8080
        - name: INVENTORY_URL
          value: http://inventory:8080
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.monitoring.svc:4318
        - name: LOG_LEVEL
          value: info
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 5
          periodSeconds: 15
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
---
# Stable + canary Services. Argo Rollouts manages their selectors (adds the
# rollouts-pod-template-hash) so the HTTPRoute can split traffic between them.
apiVersion: v1
kind: Service
metadata:
  name: frontend-stable
  labels:
    app.kubernetes.io/name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
  labels:
    app.kubernetes.io/name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
  - name: http
    port: 8080
    targetPort: http
---
# Storefront route on the shared Gateway. The plugin rewrites these two backend
# weights during a canary; they start 100/0 (all stable).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
spec:
  parentRefs:
  - name: acme-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-stable
      port: 8080
      weight: 100
    - name: frontend-canary
      port: 8080
      weight: 0
