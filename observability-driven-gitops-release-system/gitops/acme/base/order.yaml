# order — canary Rollout (replica-based). Analysis includes the checkout-success
# business SLO; a release that breaks checkout aborts automatically.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order
  labels:
    app.kubernetes.io/name: order
  annotations:
    # Phase 9: subscribe to Rollout notifications → incident service + Grafana
    notifications.argoproj.io/subscribe.on-rollout-aborted.incident: ""
    notifications.argoproj.io/subscribe.on-rollout-completed.incident: ""
    notifications.argoproj.io/subscribe.on-rollout-aborted.dashboard: ""
    notifications.argoproj.io/subscribe.on-rollout-completed.dashboard: ""
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: order
  strategy:
    canary:
      steps:
      - setWeight: 5
      - pause: { duration: 30s }
      - analysis: &order-analysis
          templates:
          - templateName: http-success-rate
          - templateName: p95-latency
          - templateName: checkout-success
          - templateName: restart-count
          args:
          - name: service-name
            value: order
          - name: container-name
            value: order
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      - setWeight: 20
      - pause: { duration: 30s }
      - analysis: *order-analysis
      - setWeight: 50
      - pause: { duration: 30s }
      - analysis: *order-analysis
      - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: order
        image: acme/order
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: acme-auth
        env:
        - name: INVENTORY_URL
          value: http://inventory:8080
        - name: PAYMENT_URL
          value: http://payment:8080
        - name: NATS_URL
          value: nats://nats:4222
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.monitoring.svc:4318
        - name: LOG_LEVEL
          value: info
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 5
          periodSeconds: 15
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
---
apiVersion: v1
kind: Service
metadata:
  name: order
  labels:
    app.kubernetes.io/name: order
spec:
  selector:
    app.kubernetes.io/name: order
  ports:
  - name: http
    port: 8080
    targetPort: http
