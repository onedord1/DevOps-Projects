# ServiceMonitor that tells Prometheus to scrape the Acme services' /metrics.
# It selects Services in the `acme` namespace labelled as part of the platform
# with a port named `http`. The Service is created in Phases 6–7; this wiring is
# in place so metrics flow as soon as the workloads deploy.
#
# honorLabels: true keeps the application's own `service` label (a const label on
# every metric) instead of letting the target's Service name overwrite it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: acme-services
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: acme-platform
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
    - acme
  selector:
    matchLabels:
      app.kubernetes.io/part-of: acme-platform
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
