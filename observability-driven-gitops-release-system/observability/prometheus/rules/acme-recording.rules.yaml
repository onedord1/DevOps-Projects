# Recording rules — precompute the RED + business SLIs for the Acme services.
# These series (the `acme:*` namespace) are what the Phase 7 AnalysisTemplates
# and the Grafana dashboards read, keeping query logic in one place.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: acme-recording-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: acme-platform
    release: kube-prometheus-stack
spec:
  groups:
  - name: acme.red.recording
    interval: 30s
    rules:
    - record: acme:request_rate:5m
      expr: sum by (service) (rate(http_requests_total[5m]))

    - record: acme:request_error_rate:5m
      expr: sum by (service) (rate(http_requests_total{code=~"5.."}[5m]))

    # Success ratio = 1 - (5xx / total). clamp_min avoids divide-by-zero.
    - record: acme:request_success_ratio:5m
      expr: |
        1 - (
          sum by (service) (rate(http_requests_total{code=~"5.."}[5m]))
          /
          clamp_min(sum by (service) (rate(http_requests_total[5m])), 1e-9)
        )

    - record: acme:request_latency_p95:5m
      expr: |
        histogram_quantile(0.95,
          sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
        )

  - name: acme.business.recording
    interval: 30s
    rules:
    - record: acme:payment_success_ratio:5m
      expr: |
        sum(rate(payments_total{result="success"}[5m]))
        /
        clamp_min(sum(rate(payments_total[5m])), 1e-9)

    - record: acme:checkout_success_ratio:5m
      expr: |
        sum(rate(orders_total{result="success"}[5m]))
        /
        clamp_min(sum(rate(orders_total[5m])), 1e-9)
