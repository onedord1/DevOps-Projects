# =============================================================================
#  Acme Platform — GitLab CI/CD + DevSecOps supply chain
#
#  Flow per service (matrix): build → scan → sbom → sign → (release: GitOps bump)
#
#    build   Buildah rootless build, push by tag, capture the immutable digest
#    scan    Trivy fails the pipeline on HIGH/CRITICAL fixable CVEs
#    sbom    Syft emits SPDX + CycloneDX SBOMs (CycloneDX surfaces in GitLab)
#    sign    Cosign KEYLESS signs the DIGEST (GitLab OIDC) + attests the SBOM
#    release Bumps the image tag in the GitOps overlay → Argo CD + Rollouts deploy
#
#  This repository lives in a subfolder, so set the project's CI/CD configuration
#  path (Settings → CI/CD → General pipelines) to:
#     observability-driven-gitops-release-system/ci/.gitlab-ci.yml
#  See ci/README.md and ADR-0012.
# =============================================================================

stages: [ build, scan, sbom, sign, release ]

variables:
  # --- pinned tool versions (June 2026) ---
  BUILDAH_IMAGE: "quay.io/buildah/stable:v1.43"
  TRIVY_IMAGE: "aquasec/trivy:0.71.2"
  SYFT_VERSION: "v1.46.0"
  COSIGN_VERSION: "v3.1.1"
  # --- build context (repo subfolder) ---
  ROOT: "observability-driven-gitops-release-system"
  APP_CONTEXT: "$ROOT/apps"
  DOCKERFILE: "$ROOT/apps/Dockerfile"
  OVERLAY: "$ROOT/gitops/acme/overlays/dev"
  # --- policy ---
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  # Faster, log-friendly CI.
  GIT_DEPTH: "20"
  FF_SCRIPT_SECTIONS: "true"

# Run on the default branch, tags, and merge requests.
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_TAG
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  interruptible: true
  tags: [ docker ]

# The five services, fanned out across every stage.
.services-matrix: &services-matrix
  parallel:
    matrix:
    - SERVICE: [ frontend, payment, order, inventory, notification ]

# -----------------------------------------------------------------------------
# build — rootless OCI build with Buildah; push by tag, record the digest.
# -----------------------------------------------------------------------------
build:
  stage: build
  image: "$BUILDAH_IMAGE"
  <<: *services-matrix
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
  script:
  - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  - IMAGE_BASE="$CI_REGISTRY_IMAGE/$SERVICE"
  - IMAGE="$IMAGE_BASE:$IMAGE_TAG"
  - buildah build --build-arg "SERVICE=$SERVICE" --build-arg "VERSION=$IMAGE_TAG" -f "$DOCKERFILE" -t "$IMAGE" "$APP_CONTEXT"
  - mkdir -p digests
  - buildah push --digestfile "digests/$SERVICE.digest" "$IMAGE" "docker://$IMAGE"
  - DIGEST="$(cat "digests/$SERVICE.digest")"
  - echo "$IMAGE_BASE@$DIGEST" > "digests/$SERVICE.ref"
  - echo "Built $SERVICE -> $IMAGE_BASE@$DIGEST"
  artifacts:
    expire_in: 1 week
    paths:
    - digests/

# -----------------------------------------------------------------------------
# scan — Trivy. Produces a GitLab container-scanning report AND gates the build.
# -----------------------------------------------------------------------------
scan:
  stage: scan
  image:
    name: "$TRIVY_IMAGE"
    entrypoint: [ "" ]
  <<: *services-matrix
  needs:
  - job: build
    artifacts: true
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  script:
  - REF="$(cat "digests/$SERVICE.ref")"
  - echo "Scanning $REF"
  # Human-readable summary (never fails).
  - trivy image --exit-code 0 --severity "$TRIVY_SEVERITY" "$REF"
  # GitLab Security Dashboard report (never fails here).
  - trivy image --exit-code 0 --format template --template "@/contrib/gitlab.tpl" -o "gl-container-scanning-report.json" "$REF"
  # GATE: fail the pipeline on fixable HIGH/CRITICAL vulnerabilities.
  - trivy image --exit-code 1 --severity "$TRIVY_SEVERITY" --ignore-unfixed "$REF"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      container_scanning: gl-container-scanning-report.json
    paths:
    - gl-container-scanning-report.json

# -----------------------------------------------------------------------------
# sbom — Syft. SPDX (for cosign attest) + CycloneDX (GitLab dependency list).
# -----------------------------------------------------------------------------
sbom:
  stage: sbom
  image: alpine:3.21
  <<: *services-matrix
  needs:
  - job: build
    artifacts: true
  variables:
    SYFT_REGISTRY_AUTH_AUTHORITY: "$CI_REGISTRY"
    SYFT_REGISTRY_AUTH_USERNAME: "$CI_REGISTRY_USER"
    SYFT_REGISTRY_AUTH_PASSWORD: "$CI_REGISTRY_PASSWORD"
  before_script:
  - apk add --no-cache curl
  - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin "$SYFT_VERSION"
  script:
  - REF="$(cat "digests/$SERVICE.ref")"
  - syft scan "registry:$REF" -o "spdx-json=sbom-$SERVICE.spdx.json" -o "cyclonedx-json=gl-sbom-$SERVICE.cdx.json"
  artifacts:
    expire_in: 1 month
    paths:
    - "sbom-*.spdx.json"
    reports:
      cyclonedx: "gl-sbom-*.cdx.json"

# -----------------------------------------------------------------------------
# sign — Cosign keyless (Sigstore + GitLab OIDC). Sign the DIGEST, attest SBOM.
# -----------------------------------------------------------------------------
sign:
  stage: sign
  image: alpine:3.21
  <<: *services-matrix
  needs:
  - job: build
    artifacts: true
  - job: sbom
    artifacts: true
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_YES: "true"
  before_script:
  - apk add --no-cache curl
  - curl -sSfL "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64" -o /usr/local/bin/cosign
  - chmod +x /usr/local/bin/cosign
  script:
  - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  - REF="$(cat "digests/$SERVICE.ref")"
  - echo "Keyless-signing $REF"
  - cosign sign "$REF"
  - cosign attest --predicate "sbom-$SERVICE.spdx.json" --type spdxjson "$REF"

# -----------------------------------------------------------------------------
# release — bump the image tag in the GitOps overlay. Argo CD + Argo Rollouts
# then canary the new version. Manual, default-branch only.
# -----------------------------------------------------------------------------
release:
  stage: release
  image: alpine:3.21
  needs:
  - job: sign
    artifacts: false
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
  variables:
    GIT_STRATEGY: clone
  before_script:
  - apk add --no-cache git
  script:
  - |
    if [ -z "$GITOPS_PUSH_TOKEN" ]; then
      echo "GITOPS_PUSH_TOKEN (a project access token with write_repository) is required"; exit 1
    fi
  - git config user.email "ci@acme.example"
  - git config user.name "acme-ci"
  - |
    # Update newTag for every service in the dev overlay.
    for svc in frontend payment order inventory notification; do
      sed -i -E "/name: acme\/${svc}\$/,/newTag:/ s/(newTag:).*/\1 ${IMAGE_TAG}/" "$OVERLAY/kustomization.yaml"
    done
  - git add "$OVERLAY/kustomization.yaml"
  - git commit -m "release bump acme images to ${IMAGE_TAG} [skip ci]"
  - git push "https://oauth2:${GITOPS_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
