services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: monitoring-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: monitoring_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.0.4-alpine
    container_name: monitoring-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2.11.10-alpine
    container_name: monitoring-nats
    ports:
      - "4222:4222"
    command: ["-js"] # Enable JetStream for persistence if needed

volumes:
  postgres_data: